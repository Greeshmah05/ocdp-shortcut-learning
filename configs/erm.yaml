# ERM Baseline Configuration on Waterbirds with ResNet-50
experiment: "erm_baseline"
supervision_tier: "T3"  # Model selection via worst-class validation accuracy (T3); T2 logged for reference

model:
  backbone: "resnet50"
  pretrained: true
  head: "gap"
  num_classes: 2

data:
  dataset: "waterbirds"
  data_dir: "data/raw"
  batch_size: 32
  img_size: 224
  num_workers: 0

training:
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 5
  warmup_epochs: 0

seeds: [42, 100, 2024]
output_dir: "results/erm"
